<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Films — The Bones Zone</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-header::before { background: linear-gradient(135deg, rgba(106,176,212,0.1) 0%, transparent 60%); }
    .page-tag, .section-label, .card-arrow { color: var(--film); }
    .section-label::after { background: rgba(106,176,212,0.35); }
    .page-title .hollow { -webkit-text-stroke-color: var(--film); }
    .loading-state {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .loading-dot {
      width: 6px; height: 6px;
      background: var(--film);
      border-radius: 50%;
      animation: blink 0.8s infinite alternate;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { to { opacity: 0.15; } }
    .error-state {
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .error-state::before { content: '// Error: '; color: var(--film); }
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    #sync-info {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    /* Film card poster uses 2:3 aspect ratio */
    .card-thumb.poster { aspect-ratio: 2/3; }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">The <span>Bones</span> Zone</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="films.html" class="active-film">Films</a></li>
      <li><a href="books.html">Books</a></li>
    </ul>
  </div>
</nav>

<header class="page-header">
  <div class="container page-header-inner">
    <p class="page-tag animate-in">Subject: Films</p>
    <h1 class="page-title animate-in delay-1">Film<br><span class="hollow">Reviews</span></h1>
    <p class="page-subtitle animate-in delay-2">Scored 0–5. </p>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">

      <div class="sync-bar">
        <div class="section-label" style="margin:0">All film reviews</div>
        <span id="sync-info">// Loading from Letterboxd…</span>
      </div>

      <!-- Search + Filter bar -->
      <div class="games-controls" id="films-controls" style="display:none">
        <div class="games-search-wrap">
          <span class="games-search-icon">⌕</span>
          <input type="text" id="films-search" class="games-search" placeholder="Search by title…" autocomplete="off">
        </div>
        <div class="games-filters">
          <button class="games-filter-btn active" data-sort="date-desc">Newest</button>
          <button class="games-filter-btn" data-sort="date-asc">Oldest</button>
          <button class="games-filter-btn" data-sort="rating-desc">Score ↓</button>
          <button class="games-filter-btn" data-sort="rating-asc">Score ↑</button>
          <button class="games-filter-btn" data-sort="alpha">A–Z</button>
        </div>
      </div>

      <div class="loading-state" id="loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span>Querying Letterboxd</span>
      </div>

      <div class="error-state" id="error" style="display:none"></div>
      <div class="card-grid" id="review-grid" style="display:none"></div>
      <div class="empty-state" id="empty" style="display:none">
        <p>No film reviews found.</p>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo">The Bones Zone</span>
    <span>// All opinions filed and irreversible</span>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
const cache = { films: [] };
let activeSort   = "date-desc";
let activeSearch = "";

function formatStars(rating) { return rating === null ? "— / 5" : `${rating} / 5`; }
function formatDate(pubDate) {
  if (!pubDate) return "";
  return new Date(pubDate).toLocaleDateString("en-US", { month: "short", year: "numeric" });
}

function buildCard(film) {
  const badgeStyle   = film.rating === null ? `style="color:var(--text-dim);border-color:var(--text-muted);"` : `style="color:var(--film);border-color:var(--film);"`;
  const thumbContent = film.posterUrl
    ? `<img src="${film.posterUrl}" alt="${film.title}" loading="lazy">`
    : `<div class="card-thumb-placeholder">[ no image ]</div>`;
  const excerpt = film.review
    ? film.review.slice(0, 140).trimEnd() + (film.review.length > 140 ? "…" : "")
    : "// No review text";
  return `
    <a href="pages/films/review.html?slug=${encodeURIComponent(film.slug)}" class="card animate-in" data-type="film">
      <div class="card-thumb poster">
        ${thumbContent}
        <span class="card-score-badge film" ${badgeStyle}>${formatStars(film.rating)}</span>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="type-pill film">Film</span>
          <span>${film.year || ""}</span>
        </div>
        <h2 class="card-title">${film.title}</h2>
        <p class="card-excerpt">${excerpt}</p>
        <div class="card-footer">
          <span class="card-date mono">${formatDate(film.pubDate)}</span>
          <span class="card-arrow">→</span>
        </div>
      </div>
    </a>`;
}

function sortFilms(films) {
  const s = [...films];
  switch (activeSort) {
    case "rating-desc": return s.sort((a,b) => (b.rating ?? -1) - (a.rating ?? -1));
    case "rating-asc":  return s.sort((a,b) => (a.rating ?? 99) - (b.rating ?? 99));
    case "date-asc":    return s.sort((a,b) => new Date(a.pubDate||0) - new Date(b.pubDate||0));
    case "alpha":       return s.sort((a,b) => a.title.localeCompare(b.title));
    case "date-desc":
    default:            return s.sort((a,b) => new Date(b.pubDate||0) - new Date(a.pubDate||0));
  }
}

function renderFiltered() {
  const grid  = document.getElementById("review-grid");
  const empty = document.getElementById("empty");
  const q = activeSearch.trim().toLowerCase();
  let films = q
    ? cache.films.filter(f => f.title.toLowerCase().includes(q))
    : sortFilms(cache.films);
  if (films.length === 0) {
    grid.style.display = "none";
    empty.style.display = "";
    return;
  }
  empty.style.display = "none";
  grid.style.display = "";
  grid.innerHTML = films.map(buildCard).join("");
  initCardStagger();
}

async function loadFilms() {
  const loading  = document.getElementById("loading");
  const error    = document.getElementById("error");
  const grid     = document.getElementById("review-grid");
  const empty    = document.getElementById("empty");
  const info     = document.getElementById("sync-info");
  const controls = document.getElementById("films-controls");

  try {
    const res  = await fetch(`/api/films?sort=${activeSort}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    cache.films = data.films || [];
    loading.style.display = "none";

    if (cache.films.length === 0) {
      empty.style.display = "";
      info.textContent = "// No reviews found on Letterboxd";
      return;
    }

    controls.style.display = "flex";
    renderFiltered();
    info.textContent = `// Synced from Letterboxd · ${cache.films.length} reviews`;

  } catch (err) {
    loading.style.display = "none";
    error.style.display   = "";
    error.textContent     = err.message;
    info.textContent      = "// Letterboxd sync failed";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadFilms();

  document.getElementById("films-search").addEventListener("input", (e) => {
    activeSearch = e.target.value;
    renderFiltered();
  });

  document.querySelectorAll("#films-controls .games-filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.sort === activeSort) return;
      document.querySelectorAll("#films-controls .games-filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeSort = btn.dataset.sort;
      renderFiltered();
    });
  });
});
</script>
</body>
</html>
