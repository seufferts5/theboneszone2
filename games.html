<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games — The Bones Zone</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .loading-state {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .loading-dot {
      width: 6px;
      height: 6px;
      background: var(--amber);
      border-radius: 50%;
      animation: blink 0.8s infinite alternate;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { to { opacity: 0.15; } }
    .error-state {
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .error-state::before { content: '// Error: '; color: var(--amber-dim); }
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    #sync-info {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">The <span>Bones</span> Zone</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="games.html" class="active">Games</a></li>
      <li><a href="films.html">Films</a></li>
      <li><a href="books.html">Books</a></li>
    </ul>
  </div>
</nav>

<header class="page-header">
  <div id="header-covers" class="header-covers"></div>
  <div class="container page-header-inner">
    <p class="page-tag animate-in">Subject: Games</p>
    <h1 class="page-title animate-in delay-1">Game<br><span class="hollow">Reviews</span></h1>
    <p class="page-subtitle animate-in delay-2">Scored 0–5.</p>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">

      <div class="sync-bar">
        <div class="section-label" style="margin:0">All game reviews</div>
        <span id="sync-info">// Loading from Notion…</span>
      </div>

      <!-- Search + Filter bar -->
      <div class="games-controls" id="games-controls" style="display:none">
        <div class="games-search-wrap">
          <span class="games-search-icon">⌕</span>
          <input type="text" id="games-search" class="games-search" placeholder="Search by title…" autocomplete="off">
        </div>
        <div class="games-filters">
          <button class="games-filter-btn active" data-sort="rating-desc">Score ↓</button>
          <button class="games-filter-btn" data-sort="rating-asc">Score ↑</button>
          <button class="games-filter-btn" data-sort="release-desc">Newest</button>
          <button class="games-filter-btn" data-sort="release-asc">Oldest</button>
          <button class="games-filter-btn" data-sort="alpha">A–Z</button>
        </div>
      </div>

      <!-- Loading state -->
      <div class="loading-state" id="loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span>Querying Notion database</span>
      </div>

      <!-- Error state -->
      <div class="error-state" id="error" style="display:none"></div>

      <!-- Games grid — populated by JS -->
      <div class="card-grid" id="review-grid" style="display:none"></div>

      <!-- Infinite scroll sentinel — always in DOM, invisible until loading -->
      <div id="scroll-sentinel" style="height:1px;margin-top:2rem;"></div>
      <div id="load-more-indicator" style="display:none;flex-direction:column;align-items:center;gap:1rem;padding:2.5rem 0;">
        <div class="scifi-loader">
          <div class="scifi-ring"></div>
          <div class="scifi-ring"></div>
          <div class="scifi-ring"></div>
          <span class="scifi-label">// Retrieving transmissions</span>
        </div>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="empty" style="display:none">
        <p>No completed games found in Notion.</p>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo">The Bones Zone</span>
    <span>// All opinions filed and irreversible</span>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
const COVER_IMAGES = { "prey": "assets/images/prey-2017.png" };

function buildHeaderCovers(games) {
  const el = document.getElementById("header-covers");
  if (!el || el.dataset.loaded) return;
  const pool = games.filter(g => COVER_IMAGES[g.slug] || g.coverUrl);
  if (pool.length < 2) return;
  el.dataset.loaded = "1";
  const picks = pool.sort(() => Math.random() - 0.5).slice(0, 9);
  el.innerHTML = picks.map(g => {
    const src = COVER_IMAGES[g.slug] || g.coverUrl;
    return `<img src="${src}" alt="" loading="lazy">`;
  }).join("");
  initCoverParallax();
}

function initCoverParallax() {
  const header = document.querySelector(".page-header");
  const covers = document.getElementById("header-covers");
  if (!header || !covers) return;
  header.addEventListener("mousemove", (e) => {
    const rect  = header.getBoundingClientRect();
    const xPct  = (e.clientX - rect.left) / rect.width; // 0 = left, 1 = right
    const shift = (xPct - 0.5) * 40; // -20px to +20px
    covers.style.transform = `translateX(${shift}px)`;
  });
  header.addEventListener("mouseleave", () => {
    covers.style.transform = "translateX(0)";
  });
}

async function loadAllCovers() {
  const all = [];
  let cursor = null;
  let hasMore = true;
  while (hasMore) {
    try {
      const params = new URLSearchParams({ sort: "rating-desc", limit: 100 });
      if (cursor) params.set("cursor", cursor);
      const res  = await fetch(`/api/games?${params}`);
      if (!res.ok) break;
      const data = await res.json();
      all.push(...(data.games || []));
      cursor  = data.next_cursor || null;
      hasMore = data.has_more || false;
    } catch { break; }
  }
  buildHeaderCovers(all);
}

const cache = { games: [], nextCursor: null, hasMore: true, synced: null };
let fetching  = false;
let activeSort   = "rating-desc";
let activeSearch = "";

function getReviewHref(slug) { return `pages/games/review.html?slug=${encodeURIComponent(slug)}`; }
function formatDate(iso) {
  if (!iso) return "Unknown";
  return new Date(iso).toLocaleDateString("en-US", { month: "short", year: "numeric" });
}
function formatScore(r) { return (r === null || r === undefined) ? "— / 5" : `${r} / 5`; }

function buildCard(game) {
  const slug         = game.slug;
  const img          = COVER_IMAGES[slug] || game.coverUrl || null;
  const badgeStyle   = game.rating === null ? `style="color:var(--text-dim);border-color:var(--text-muted);"` : "";
  const thumbContent = img
    ? `<img src="${img}" alt="${game.title}" loading="lazy">`
    : `<div class="card-thumb-placeholder">[ no image ]</div>`;
  return `
    <a href="${getReviewHref(slug)}" class="card animate-in" data-type="game">
      <div class="card-thumb">
        ${thumbContent}
        <span class="card-score-badge" ${badgeStyle}>${formatScore(game.rating)}</span>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="type-pill game">Game</span>
          <span>${game.genres.slice(0,3).join(" · ") || "Game"}</span>
        </div>
        <h2 class="card-title">${game.title}</h2>
        <p class="card-excerpt">${game.dev} — ${game.consoles.slice(0,2).join(" / ") || "PC"}</p>
        <div class="card-footer">
          <span class="card-date mono">${formatDate(game.released)}</span>
          <span class="card-arrow">→</span>
        </div>
      </div>
    </a>`;
}


function renderFiltered() {
  // Full re-render — only called when search/sort changes
  const grid      = document.getElementById("review-grid");
  const empty     = document.getElementById("empty");
  const sentinel  = document.getElementById("scroll-sentinel");
  const indicator = document.getElementById("load-more-indicator");

  const q = activeSearch.trim().toLowerCase();
  let games = q
    ? cache.games.filter(g => g.title.toLowerCase().includes(q))
    : cache.games;

  const isFiltering = q || activeSort !== "rating-desc";

  if (games.length === 0) {
    grid.style.display = "none";
    empty.style.display = "";
    return;
  }

  empty.style.display = "none";
  grid.style.display = "";
  grid.innerHTML = games.map(buildCard).join("");
  initCardStagger();

  if (sentinel) sentinel.style.height = (isFiltering || !cache.hasMore) ? "0" : "1px";
  if (indicator && isFiltering) indicator.style.display = "none";
}

function appendBatch(newGames) {
  const grid  = document.getElementById("review-grid");
  const empty = document.getElementById("empty");

  if (cache.games.length === 0) {
    empty.style.display = "";
    return;
  }

  empty.style.display = "none";
  grid.style.display = "";

  // Mark existing cards as settled so they don't re-animate
  grid.querySelectorAll(".card.animate-in").forEach(c => {
    c.classList.remove("animate-in");
    c.style.animationDelay = "";
  });

  grid.insertAdjacentHTML("beforeend", newGames.map(buildCard).join(""));

  // Only stagger the newly added cards
  const newCards = grid.querySelectorAll(".card.animate-in");
  newCards.forEach((card, i) => {
    card.style.animationDelay = (i * 0.06) + "s";
  });
}

function updateSyncInfo() {
  const info = document.getElementById("sync-info");
  if (!cache.synced) return;
  const syncTime = new Date(cache.synced);
  const timeStr = syncTime.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  const dateStr = syncTime.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const more = cache.hasMore ? "+" : "";
  info.textContent = `// Synced · ${dateStr} at ${timeStr} · ${cache.games.length}${more} entries`;
}

async function fetchAll() {
  while (cache.hasMore && !fetching) {
    fetching = true;
    try {
      const params = new URLSearchParams({ sort: activeSort });
      if (cache.nextCursor) params.set("cursor", cache.nextCursor);
      const res  = await fetch(`/api/games?${params}`);
      if (!res.ok) break;
      const data = await res.json();
      if (data.error) break;
      cache.games.push(...(data.games || []));
      cache.nextCursor = data.next_cursor || null;
      cache.hasMore    = data.has_more || false;
    } catch { break; }
    finally { fetching = false; }
  }
}

async function fetchBatch() {
  if (fetching || !cache.hasMore) return;
  fetching = true;

  const indicator = document.getElementById("load-more-indicator");
  const loadingEl = document.getElementById("loading");
  const errorEl   = document.getElementById("error");

  if (indicator) indicator.style.display = "flex";

  try {
    const params = new URLSearchParams({ sort: activeSort });
    if (cache.nextCursor) params.set("cursor", cache.nextCursor);
    const url = `/api/games?${params}`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const newGames = data.games || [];
    cache.games.push(...newGames);
    cache.nextCursor = data.next_cursor || null;
    cache.hasMore    = data.has_more || false;
    cache.synced     = cache.synced || data.synced;

    loadingEl.style.display = "none";
    document.getElementById("games-controls").style.display = "flex";

    appendBatch(newGames);
    updateSyncInfo();

  } catch (err) {
    loadingEl.style.display = "none";
    errorEl.style.display   = "";
    errorEl.textContent     = err.message;
    document.getElementById("sync-info").textContent = "// Notion sync failed";
  } finally {
    fetching = false;
    if (indicator) indicator.style.display = "none";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  // Search — fetch all remaining pages first, then filter
  const searchInput = document.getElementById("games-search");
  searchInput.addEventListener("input", async () => {
    activeSearch = searchInput.value;
    if (activeSearch.trim() && cache.hasMore) {
      searchInput.disabled = true;
      searchInput.placeholder = "// Scanning all transmissions…";
      await fetchAll();
      searchInput.disabled = false;
      searchInput.placeholder = "Search by title…";
      searchInput.focus();
    }
    renderFiltered();
  });

  // Sort buttons — reset cache and re-fetch from Notion with new sort
  document.querySelectorAll(".games-filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.sort === activeSort) return;
      document.querySelectorAll(".games-filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeSort = btn.dataset.sort;

      // Reset cache for fresh fetch with new sort
      cache.games = [];
      cache.nextCursor = null;
      cache.hasMore = true;

      const grid = document.getElementById("review-grid");
      grid.innerHTML = "";
      grid.style.display = "none";
      document.getElementById("loading").style.display = "flex";

      fetchBatch();
    });
  });

  // Initial fetch + cover collage (run in parallel)
  fetchBatch();
  loadAllCovers();

  // Infinite scroll
  const sentinel = document.getElementById("scroll-sentinel");
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && cache.hasMore && !fetching && !activeSearch) {
      fetchBatch();
    }
  }, { rootMargin: "400px" });
  observer.observe(sentinel);
});
</script>
</body>
</html>
