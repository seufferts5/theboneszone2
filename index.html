<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bones Zone</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .loading-state {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .loading-dot {
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
      animation: blink 0.8s infinite alternate;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { to { opacity: 0.15; } }
    .error-state {
      padding: 2rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .error-state::before { content: '// Error: '; color: var(--amber-dim); }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">The <span>Bones</span> Zone</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="films.html">Films</a></li>
      <li><a href="books.html">Books</a></li>
    </ul>
  </div>
</nav>

<!-- HERO -->
<header class="page-header hero-header" id="hero-header">
  <div class="hero-bg-img" id="hero-bg"></div>
  <div class="container page-header-inner">
    <p class="page-tag animate-in">Transmission active</p>
    <h1 class="page-title animate-in delay-1">
      The<br><span class="hollow">Bones</span><br>Zone
    </h1>
  </div>
</header>

<main>

  <!-- LATEST REVIEWS -->
  <section class="section">
    <div class="container">
      <div class="section-label">Latest transmissions</div>

      <div class="loading-state" id="home-loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span>Querying Notion database</span>
      </div>
      <div class="error-state" id="home-error" style="display:none"></div>
      <div class="latest-list" id="latest-list" style="display:none"></div>
    </div>
  </section>

  <!-- CURRENTLY IN ROTATION -->
  <section class="section rotation-section" id="rotation-section">
    <div class="container">
      <div class="section-label">Currently in rotation</div>
      <div class="rotation-strip" id="rotation-strip"></div>
    </div>
  </section>

</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo">The Bones Zone</span>
    <span>// Lowkirkenuinley just my opinions </span>
  </div>
</footer>

<script src="js/main.js"></script>
<script>

function formatDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("en-US", { month: "short", year: "numeric" });
}

function buildRow(item) {
  const isGame     = item.type === "game";
  const typeColor  = isGame ? "var(--amber)"              : "var(--film)";
  const typeBorder = isGame ? "var(--amber-dim)"          : "rgba(106,176,212,0.4)";
  const typeBg     = isGame ? "var(--amber-glow)"         : "var(--film-dim)";
  const href       = isGame
    ? `/games/${encodeURIComponent(item.slug)}`
    : `pages/films/review.html?slug=${encodeURIComponent(item.slug)}`;
  const scoreStr   = (item.rating !== null && item.rating !== undefined)
    ? `${item.rating} / 5`
    : "— / 5";
  return `
    <a href="${href}" class="latest-row" data-type="${item.type}">
      <span style="background:${typeBg};color:${typeColor};border:1px solid ${typeBorder};padding:0.1rem 0.45rem;font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;flex-shrink:0">${isGame ? "Game" : "Film"}</span>
      <span class="latest-row-title">${item.title}</span>
      <span class="latest-row-meta">
        <span class="latest-row-score">${scoreStr}</span>
        <span>${formatDate(item.date)}</span>
      </span>
      <span class="latest-row-arrow">→</span>
    </a>`;
}

function buildRotationItem(game) {
  const platform = game.consoles[0] || game.dev || "";
  return `
    <a href="/games/${encodeURIComponent(game.slug)}" class="rotation-item">
      <img src="${game.coverUrl}" alt="${game.title}" loading="lazy">
      <span class="rotation-item-title">${game.title}</span>
      <span class="rotation-item-platform">${platform}</span>
    </a>`;
}

async function loadRecent() {
  const loading = document.getElementById("home-loading");
  const error   = document.getElementById("home-error");
  const list    = document.getElementById("latest-list");

  try {
    const [gamesRes, filmsRes] = await Promise.all([
      fetch("/api/games?sort=completed-desc&limit=6"),
      fetch("/api/films?sort=date-desc")
    ]);

    const gamesData = gamesRes.ok ? await gamesRes.json() : { games: [] };
    const filmsData = filmsRes.ok ? await filmsRes.json() : { films: [] };

    const games = (gamesData.games || []).map(g => ({
      type:   "game",
      title:  g.title,
      slug:   g.slug,
      rating: g.rating,
      date:   g.completed,
    }));

    const films = (filmsData.films || []).slice(0, 6).map(f => ({
      type:   "film",
      title:  f.title,
      slug:   f.slug,
      rating: f.rating,
      date:   f.pubDate,
    }));

    const combined = [...games, ...films]
      .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))
      .slice(0, 5);

    loading.style.display = "none";
    list.innerHTML = combined.map(buildRow).join("");
    list.style.display = "flex";

  } catch (err) {
    loading.style.display = "none";
    error.style.display = "";
    error.textContent = err.message;
  }
}

async function loadRotation() {
  try {
    const res  = await fetch("/api/currently-playing");
    if (!res.ok) return;
    const data = await res.json();
    const games = (data.games || []).filter(g => g.coverUrl);
    if (!games.length) return;

    const strip   = document.getElementById("rotation-strip");
    const section = document.getElementById("rotation-section");
    strip.innerHTML = games.map(buildRotationItem).join("");
    section.classList.add("visible");
  } catch { /* fail silently — section stays hidden */ }
}

document.addEventListener("DOMContentLoaded", () => {
  loadRecent();
  loadRotation();
});
</script>
<script>
  (function () {
    const bg     = document.getElementById("hero-bg");
    const header = document.getElementById("hero-header");
    if (!bg || !header) return;
    header.addEventListener("mousemove", function (e) {
      const rect = header.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const dx = (e.clientX - rect.left - cx) / cx;
      const dy = (e.clientY - rect.top - cy) / cy;
      bg.style.transform = "translate(" + (dx * 18) + "px, " + (dy * 12) + "px)";
    });
    header.addEventListener("mouseleave", function () {
      bg.style.transform = "translate(0px, 0px)";
    });
  })();
</script>
</body>
</html>
