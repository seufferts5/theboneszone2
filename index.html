<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bones Zone</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .loading-state {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .loading-dot {
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
      animation: blink 0.8s infinite alternate;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { to { opacity: 0.15; } }
    .error-state {
      padding: 3rem 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .error-state::before { content: '// Error: '; color: var(--amber-dim); }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">The <span>Bones</span> Zone</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="films.html">Films</a></li>
      <li><a href="books.html">Books</a></li>
    </ul>
  </div>
</nav>

<!-- HERO -->
<header class="page-header hero-header" id="hero-header">
  <div class="hero-bg-img" id="hero-bg"></div>
  <div class="container page-header-inner">
    <p class="page-tag animate-in">Transmission active</p>
    <h1 class="page-title animate-in delay-1">
      The<br><span class="hollow">Bones</span><br>Zone
    </h1>
  </div>
</header>

<main>

  <!-- LATEST REVIEWS -->
  <section class="section">
    <div class="container">
      <div class="section-label">Latest transmissions</div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="game">Games</button>
        <button class="filter-btn" data-filter="film">Films</button>
        <button class="filter-btn" data-filter="book">Books</button>
      </div>

      <div class="loading-state" id="home-loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span>Querying Notion database</span>
      </div>
      <div class="error-state" id="home-error" style="display:none"></div>
      <div class="card-grid" id="review-grid" style="display:none"></div>
    </div>
  </section>

</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo">The Bones Zone</span>
    <span>// All opinions filed and irreversible</span>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
const COVER_IMAGES = { "prey": "assets/images/prey-2017.png" };

function formatDate(iso) {
  if (!iso) return "Unknown";
  return new Date(iso).toLocaleDateString("en-US", { month: "short", year: "numeric" });
}

function buildCard(game) {
  const slug         = game.slug;
  const img          = COVER_IMAGES[slug] || game.coverUrl || null;
  const badgeStyle   = game.rating === null ? `style="color:var(--text-dim);border-color:var(--text-muted);"` : "";
  const thumbContent = img
    ? `<img src="${img}" alt="${game.title}" loading="lazy">`
    : `<div class="card-thumb-placeholder">[ no image ]</div>`;
  return `
    <a href="pages/games/review.html?slug=${encodeURIComponent(slug)}" class="card animate-in" data-type="game">
      <div class="card-thumb">
        ${thumbContent}
        <span class="card-score-badge" ${badgeStyle}>${game.rating ?? "—"} / 5</span>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="type-pill game">Game</span>
          <span>${game.genres.slice(0,3).join(" · ") || "Game"}</span>
        </div>
        <h2 class="card-title">${game.title}</h2>
        <p class="card-excerpt">${game.dev} — ${game.consoles.slice(0,2).join(" / ") || "PC"}</p>
        <div class="card-footer">
          <span class="card-date mono">${formatDate(game.completed)}</span>
          <span class="card-arrow">→</span>
        </div>
      </div>
    </a>`;
}

async function loadRecent() {
  const loading = document.getElementById("home-loading");
  const error   = document.getElementById("home-error");
  const grid    = document.getElementById("review-grid");
  try {
    const res  = await fetch("/api/games?sort=release-desc");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    loading.style.display = "none";
    grid.innerHTML = (data.games || []).map(buildCard).join("");
    grid.style.display = "";
    initCardStagger();
    initFilters();
  } catch (err) {
    loading.style.display = "none";
    error.style.display = "";
    error.textContent = err.message;
  }
}

document.addEventListener("DOMContentLoaded", loadRecent);
</script>
<script>
  (function () {
    const bg = document.getElementById("hero-bg");
    const header = document.getElementById("hero-header");
    if (!bg || !header) return;
    header.addEventListener("mousemove", function (e) {
      const rect = header.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const dx = (e.clientX - rect.left - cx) / cx;
      const dy = (e.clientY - rect.top - cy) / cy;
      bg.style.transform = "translate(" + (dx * 18) + "px, " + (dy * 12) + "px)";
    });
    header.addEventListener("mouseleave", function () {
      bg.style.transform = "translate(0px, 0px)";
    });
  })();
</script>
</body>
</html>
